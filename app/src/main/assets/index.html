<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#102622"><title>Daktilo Bulmaca</title><link rel="stylesheet" href="style.css"></head>
<body><main class="game">
<header><button class="icon" id="chapters" aria-label="Bölümler">☰</button><div class="brand"><small>KLASİK KELİME BULMACASI</small><h1>DAKTİLO</h1><span>B U L M A C A</span></div><button class="icon" id="settings" aria-label="Ayarlar">⚙</button></header>
<section class="progress"><div><span id="chapterLabel"></span><span id="score"></span></div><div class="track"><i id="progressBar"></i></div></section>
<section class="paper" id="paper" aria-label="Bulmaca sorusu"><div class="paper-top"><span id="category"></span><span id="number"></span></div><p id="question"></p><div id="slots" class="slots" aria-label="Cevap harfleri"></div><div class="paper-bottom"><span id="length"></span><span id="difficulty"></span></div><p id="feedback" role="status" aria-live="polite"></p></section>
<section class="typewriter" aria-label="Daktilo klavyesi"><div class="carriage" id="carriage"><i></i><b></b><i></i></div><div class="mechanism"><div class="basket"></div><div class="typebar" id="typebar"></div><span class="plate">TEKNOLOJİX · No. 01</span><button id="returnKey" class="lever" aria-label="Cevabı kontrol et">↵</button></div><div class="keys" id="keys"></div><div class="bottom-keys"><button id="erase" aria-label="Harf sil">⌫ SİL</button><button id="check">KONTROL ET <span>↵</span></button></div></section>
<footer><button id="hint">✦ <span>HARF AÇ</span> <b id="hintCount"></b></button><button id="skip">SONRA ÇÖZ <span>→</span></button></footer><div class="caption">Her tuşta bir kelime, her kelimede bir keşif.</div>
</main><dialog id="dialog"><button id="closeDialog" class="close" aria-label="Kapat">×</button><div id="dialogContent"></div></dialog><script src="questions.js"></script><script src="game.js"></script></body></html>
