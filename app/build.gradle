plugins { id 'com.android.application' }

android {
    namespace 'com.teknolojix.daktilobulmaca'
    compileSdk 36
    defaultConfig {
        applicationId 'com.teknolojix.daktilobulmaca'
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName '1.1.1'
    }
    signingConfigs {
        release {
            if (System.getenv('RELEASE_STORE_FILE')) {
                storeFile file(System.getenv('RELEASE_STORE_FILE'))
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('RELEASE_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
